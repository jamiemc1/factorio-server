# fly.toml app configuration file generated for factorio-server-long-leaf-7987 on 2025-11-06T21:04:43Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'factorio-server-long-leaf-7987'
primary_region = 'lhr'
kill_signal = 'SIGTERM'
kill_timeout = '30s'

[build]

[env]
  DLC_SPACE_AGE = 'true'
  GENERATE_NEW_SAVE = 'false'
  LOAD_LATEST_SAVE = 'true'
  SAVE_NAME = '_autosave1'

[http_service]
  internal_port = 34197
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[services]]
  protocol = 'udp'
  internal_port = 34197

  [[services.ports]]
    port = 34197

[[vm]]
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 4
