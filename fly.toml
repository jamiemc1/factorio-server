# fly.toml app configuration file generated for dnp-factorio-server on 2026-07-05T19:18:45+09:30
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'dnp-factorio-server'
primary_region = 'syd'
kill_signal = 'SIGTERM'
kill_timeout = '2m0s'

[build]

[env]
  # Factorio headless build to install on boot. Accepts an exact 'x.y.z' or the
  # channel keywords 'experimental' / 'stable'. Note that 'stable' currently
  # lags well behind and would refuse to load a 2.1 save.
  FACTORIO_VERSION = 'experimental'
  # Enable only the elevated-rails DLC mod (disables space-age + quality).
  # This env var accepts a space-separated list of DLC mod names.
  DLC_SPACE_AGE = 'elevated-rails'
  GENERATE_NEW_SAVE = 'false'
  LOAD_LATEST_SAVE = 'true'
  SAVE_NAME = '_autosave1'
  # Go supervisor web interface (log stream + RCON console).
  WEB_ENABLED = 'true'
  WEB_ADDR = ':8080'

# HTTP service fronts the supervisor's web interface (log stream, player list,
# RCON console). The Factorio game itself is exposed via the UDP service below.
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

# Persistent storage for the game install, mods and saves. Without it every boot
# re-downloads ~1.5GB of mods and the save from S3; with it, S3 is only touched
# when the volume is new (or holds a save older than the one in the bucket).
[mounts]
  source = 'factorio_data'
  destination = '/factorio'
  initial_size = '10gb'

[[services]]
  protocol = 'udp'
  internal_port = 34197

  [[services.ports]]
    port = 34197

[[vm]]
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 8
  memory_mb = 2048
