# fly.toml app configuration file generated for dnp-factorio-server on 2026-07-05T19:18:45+09:30
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'dnp-factorio-server'
primary_region = 'syd'
kill_signal = 'SIGTERM'
kill_timeout = '2m0s'

[build]

[env]
  DLC_SPACE_AGE = 'true'
  GENERATE_NEW_SAVE = 'false'
  LOAD_LATEST_SAVE = 'true'
  SAVE_NAME = '_autosave1'

[http_service]
  internal_port = 34197
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[services]]
  protocol = 'udp'
  internal_port = 34197

  [[services.ports]]
    port = 34197

[[vm]]
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 8
  memory_mb = 2048
